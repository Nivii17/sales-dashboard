<h2>Sales Dashboard</h2>
<select id="f" onchange="draw()"><option>All</option><option>Laptop</option><option>Phone</option><option>Watch</option></select>
<h3 id="kpi"></h3>
<canvas id="c1" height="90"></canvas><canvas id="c2" height="90"></canvas>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1"></script>
<script>
// [month, product, revenue, orders]
const data = [["Jan","Laptop",5000,5],["Jan","Phone",3000,6],["Jan","Watch",1000,5],
["Feb","Laptop",6000,6],["Feb","Phone",2500,5],["Feb","Watch",1500,7],
["Mar","Laptop",4500,4],["Mar","Phone",4000,8],["Mar","Watch",2000,9]];
let a, b;
function draw() {
  const rows = data.filter(d => f.value == "All" || d[1] == f.value);
  const sum = (arr, i) => arr.reduce((s, d) => s + d[i], 0);
  kpi.innerText = `Revenue: $${sum(rows,2)} | Orders: ${sum(rows,3)} | Avg order: $${Math.round(sum(rows,2)/sum(rows,3))}`;
  const months = ["Jan","Feb","Mar"], prods = ["Laptop","Phone","Watch"];
  if (a) { a.destroy(); b.destroy(); }
  a = new Chart(c1, {type:"line", data:{labels:months, datasets:[{label:"Revenue by month", data:months.map(m => sum(rows.filter(d => d[0]==m),2))}]}});
  b = new Chart(c2, {type:"bar", data:{labels:prods, datasets:[{label:"Revenue by product", data:prods.map(p => sum(rows.filter(d => d[1]==p),2))}]}});
}
draw();
</script>
